<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f5ee">
  <meta name="description" content="自動開啟相機，與小菁鷹運動版一起合照。">
  <title>小菁運動版相機合照</title>
  <link rel="icon" href="./favicon.svg">
  <link rel="stylesheet" href="./direct-ar.css?v=camera-2">
</head>
<body>
  <main id="direct-app">
    <section id="camera-stage" aria-label="相機與角色合照畫面"><video id="camera-video" autoplay muted playsinline></video><div id="character-layer"></div></section>
    <section id="loading" role="status" aria-live="polite"><div class="loader" aria-hidden="true"><span>✳</span></div><h1 id="loading-title">正在準備合照</h1><p id="loading-note">請在手機提示中允許使用相機…</p></section>
    <div id="camera-ui" hidden>
      <header><span id="model-label"></span><span class="live">● 循環播放中</span></header>
      <p class="gesture-hint">拖曳角色位置 · 雙指縮放</p>
      <div class="camera-controls"><label class="size-control" for="character-size">角色大小<input id="character-size" type="range" min="45" max="160" value="100"></label><div class="shutter-row"><a class="return-link" href="./">活動介紹</a><button id="shutter" type="button" aria-label="拍照"><span></span></button><button id="switch-camera" type="button">切換鏡頭</button></div><p class="privacy">照片只在手機內處理，不上傳影像。</p></div>
    </div>
    <dialog id="photo-view"><img id="photo-result" alt="人物、場景與小菁運動版的合照"><div class="photo-actions"><button id="retake" type="button">再拍一張</button><button id="save-photo" type="button">儲存照片</button></div><p id="save-note" role="status"></p></dialog>
  </main>
  <script type="module" src="./direct-ar.js?v=camera-2"></script>
</body>
</html>
